<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projectile Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#0A1D33; --panel:#102B4A; --rule:#1E4470; --hair:#193A61;
    --ink:#CFE3F5; --dim:#7FA6CC; --chalk:#E8F3FF;
    --target:#FF5C3B; --caution:#FFC24B;
    --editor:#081729;
    --sans:"Archivo","Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --field:#E7EDF3; --panel:#F3F7FA; --rule:#B4C6D6; --hair:#D3DFE8;
    --ink:#123055; --dim:#5C7894; --chalk:#1B4A7A; --editor:#FFFFFF;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--field); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    padding:24px 20px 40px;
  }
  .wrap{max-width:1140px;margin:0 auto}

  /* ---- header ---- */
  header{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;
         padding-bottom:14px;border-bottom:1px solid var(--rule)}
  h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
  .tagline{color:var(--dim);font-size:14px;margin:2px 0 0}
  .nav{display:flex;align-items:center;gap:12px}
  .count{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
  .ticks{display:flex;gap:3px}
  .tick{width:12px;height:22px;padding:0;border:1px solid var(--rule);border-radius:1px;
        background:transparent;cursor:pointer;position:relative}
  .tick:hover{background:var(--hair)}
  .tick.wall::after{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:4px;background:var(--caution)}
  .tick.on{background:var(--target);border-color:var(--target)}
  .tick.done{background:var(--hair)}

  /* ---- plot ---- */
  #plot{position:relative;width:100%;height:clamp(280px,44vh,440px);margin-top:18px;
        background:var(--panel);border:1px solid var(--rule);border-radius:2px;overflow:hidden}
  #plot svg{position:absolute;inset:0;display:block}
  .grid-fine{fill:none;stroke:var(--hair);stroke-width:1}
  .grid-main{fill:none;stroke:var(--rule);stroke-width:1}
  .axis{font-family:var(--mono);font-size:10px;fill:var(--dim)}
  .ground{stroke:var(--rule);stroke-width:2}
  .traj{fill:none;stroke:var(--chalk);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .traj.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .mark{fill:var(--caution);stroke:var(--field);stroke-width:1.5}
  .mark.draw{opacity:0;animation:pop .2s ease-out .6s forwards}
  @keyframes pop{to{opacity:1}}
  .wall-body{stroke:var(--rule);stroke-width:1}
  .wall-cap{fill:var(--caution)}
  .caption{font-family:var(--mono);font-size:11px;fill:var(--caution)}
  .ring{fill:none;stroke:var(--target);stroke-width:2}
  .bull{fill:var(--target)}
  .cross{stroke:var(--target);stroke-width:1;opacity:.55}
  @media (prefers-reduced-motion:reduce){
    .traj.draw{animation:none;stroke-dashoffset:0}
    .mark.draw{animation:none;opacity:1}
  }

  /* ---- readout strip ---- */
  .strip{display:grid;grid-template-columns:repeat(5,1fr);
         border:1px solid var(--rule);border-top:0;background:var(--panel)}
  .cell{padding:10px 14px;border-left:1px solid var(--hair);min-width:0}
  .cell:first-child{border-left:0}
  .cell .k{font-size:12px;color:var(--dim)}
  .cell .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;
           margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .u{font-size:12px;color:var(--dim);margin-left:3px}
  .cell.result .v{color:var(--chalk)}
  .cell.hit .v{color:var(--caution)}

  /* ---- work area ---- */
  .work{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;margin-top:20px;align-items:start}
  .edit label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  textarea{width:100%;height:230px;padding:12px 14px;border:1px solid var(--rule);border-radius:2px;
           background:var(--editor);color:var(--ink);resize:vertical;
           font-family:var(--mono);font-size:13px;line-height:1.65;tab-size:2}
  textarea::placeholder{color:var(--dim);opacity:.75}
  .row{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
  button.launch{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--field);
                background:var(--target);border:0;border-radius:2px;padding:11px 22px;cursor:pointer}
  button.launch:hover{filter:brightness(1.08)}
  .kbd{font-family:var(--mono);font-size:12px;color:var(--dim)}
  :focus-visible{outline:2px solid var(--caution);outline-offset:2px}

  .brief{border:1px solid var(--rule);border-radius:2px;background:var(--panel);padding:14px}
  .brief h2{font-size:13px;font-weight:600;margin:0 0 8px}
  .brief p{font-size:13px;color:var(--dim);margin:0 0 10px}
  .vars{font-family:var(--mono);font-size:12.5px;line-height:1.9;margin:0;padding:0;list-style:none}
  .vars span{color:var(--chalk)}
  .vars em{font-style:normal;color:var(--dim)}

  #status{margin-top:14px;padding:10px 14px;border-left:3px solid var(--rule);
          background:var(--panel);font-size:14px;display:none}
  #status.show{display:block}
  #status.ok{border-left-color:var(--caution);color:var(--caution)}
  #status.bad{border-left-color:var(--target);color:var(--target)}

  @media(max-width:820px){
    .work{grid-template-columns:1fr}
    .strip{grid-template-columns:repeat(2,1fr)}
    .cell{border-top:1px solid var(--hair)}
    .cell:nth-child(odd){border-left:0}
    .cell:nth-child(-n+2){border-top:0}
    .cell:last-child{grid-column:1 / -1;border-left:0}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Projectile Challenge</h1>
      <p class="tagline">Every launcher distorts your input. Work out how, then cancel it.</p>
    </div>
    <div class="nav">
      <span class="count" id="count">Level 1 of 18</span>
      <div class="ticks" id="ticks"></div>
    </div>
  </header>

  <div id="plot"></div>

  <div class="strip">
    <div class="cell"><div class="k">Target distance</div><div class="v" id="tDist">—</div></div>
    <div class="cell"><div class="k">Target height</div><div class="v" id="tHeight">—</div></div>
    <div class="cell result"><div class="k">Ground range</div><div class="v" id="rRange">—</div></div>
    <div class="cell result"><div class="k">Height at target</div><div class="v" id="rHeight">—</div></div>
    <div class="cell hit"><div class="k">Closest approach</div><div class="v" id="rMiss">—</div></div>
  </div>

  <div class="work">
    <div class="edit">
      <label for="code">Firing solution</label>
      <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
      <div class="row">
        <button class="launch" id="fire" type="button">Launch</button>
        <span class="kbd">or Ctrl / &#8984; + Enter</span>
      </div>
      <div id="status"></div>
    </div>

    <aside class="brief">
      <h2 id="briefTitle">Level 1</h2>
      <p id="briefText">Hit the target inside a 0.5 m radius.</p>
      <ul class="vars" id="varList"></ul>
    </aside>
  </div>

</div>

<script>
(() => {
  'use strict';

  const G = 9.8;          // m/s^2
  const WALL_W = 1;       // obstacle thickness, metres
  const ADV_FROM = 14;    // levels from here take ux / uy instead of u / costheta

  const levels = [
    { d: 111, h: 0,  t: (s, c) => [s - 7, c],    tol: 0.5 },
    { d: 194, h: 30, t: (s, c) => [s + 23, c],   tol: 0.5 },
    { d: 116, h: 0,  t: (s, c) => [s, c - 0.1],  tol: 0.5 },
    { d: 142, h: 40, t: (s, c) => [s, c + 0.05], tol: 0.5 },
    { d: 136, h: 0,  t: (s, c) => [s * 1.25, c], tol: 0.5 },
    { d: 154, h: 0,  t: (s, c) => [s, c * 0.5],  tol: 0.5 },
    { d: 152, h: 60, t: (s, c) => [s * 0.8, c],  tol: 0.5 },
    { d: 179, h: 25, t: (s, c) => [s, c * 0.75], tol: 0.5 },
    { d: 150, h: 45, t: (s, c) => [2 * s + 3, c],   tol: 0.5 },
    { d: 150, h: 45, t: (s, c) => [3 * s - 2, c],   tol: 0.5 },
    { d: 180, h: 65, t: (s, c) => [1.5 * s + 3, c], tol: 0.5 },
    { d: 180, h: 65, t: (s, c) => [3 * s - 1.5, c], tol: 0.5 },
    { d: 117.6, h: 0, ox: 58.8, oy: 39, tol: 0.5, t: (s, c) => {
        const st = (s > 30 && s < 40) ? 30 : s;
        return [(s === 35) ? st + 5 : st, c];
      } },
    { d: 185.856, h: 0, ox: 92.928, oy: 34.5, tol: 0.5, t: (s, c) => {
        const st = (s > 40 && s < 45) ? 50 : s;
        return [(s === 44) ? st + 4 : st, c];
      } },
    { d: 137, h: 15, t: (x, y) => [x - 14, y],   tol: 0.5 },
    { d: 182, h: 55, t: (x, y) => [x, y + 8],    tol: 0.5 },
    { d: 169, h: 65, t: (x, y) => [x * 1.75, y], tol: 0.5 },
    { d: 107, h: 35, t: (x, y) => [x, y * 0.9],  tol: 0.5 }
  ];

  const $ = id => document.getElementById(id);
  const ui = {
    plot: $('plot'), ticks: $('ticks'), count: $('count'),
    tDist: $('tDist'), tHeight: $('tHeight'), rRange: $('rRange'),
    rHeight: $('rHeight'), rMiss: $('rMiss'),
    code: $('code'), fire: $('fire'), status: $('status'),
    briefTitle: $('briefTitle'), briefText: $('briefText'), varList: $('varList')
  };

  const placeholder = {
    basic:
`u = 50;
costheta = 0.8;

inverseu = u;
inversecostheta = costheta;`,
    adv:
`ux = 30;
uy = 25;

inverseux = ux;
inverseuy = uy;`
  };

  const varHelp = {
    basic: [
      ['u', 'launch speed you want, m/s'],
      ['costheta', 'cosine of your launch angle'],
      ['inverseu', 'speed you feed the launcher'],
      ['inversecostheta', 'cosine you feed the launcher']
    ],
    adv: [
      ['ux', 'horizontal velocity you want, m/s'],
      ['uy', 'vertical velocity you want, m/s'],
      ['inverseux', 'value you feed the launcher'],
      ['inverseuy', 'value you feed the launcher']
    ]
  };

  const state = { level: 0, shot: null, cleared: new Set() };
  let advanceTimer = null, animate = false;

  const fmt = n => Number.isFinite(n) ? String(Math.round(n * 100) / 100) : '\u2014';
  const metres = n => Number.isFinite(n) ? `${fmt(n)}<span class="u">m</span>` : '\u2014';
  const isAdv = i => i >= ADV_FROM;

  /* ---- running the player's code -------------------------------------- */
  // Two passes: the first pre-declares the names so a bare `u = 50` stays local.
  // `let u = 50` collides with that, throws SyntaxError, and the second pass
  // runs the code as written instead.
  function readVars(code, names) {
    const ret = 'return {' +
      names.map(n => `${n}: typeof ${n} !== "undefined" ? ${n} : undefined`).join(',') + '};';
    try {
      return new Function(`"use strict"; let ${names.join(',')};\n${code}\n;${ret}`)();
    } catch (err) {
      if (!(err instanceof SyntaxError)) throw err;
      return new Function(`"use strict";\n${code}\n;${ret}`)();
    }
  }

  /* ---- physics --------------------------------------------------------- */
  function simulate(vx, vy, lvl) {
    const tof = 2 * vy / G;
    const range = vx * tof;
    const tAtX = lvl.d / vx;
    const heightAtTarget = vy * tAtX - 0.5 * G * tAtX * tAtX;

    // Step bounded in x so a 1 m wall can never be stepped over.
    const dt = Math.min(tof / 2000, 0.2 / vx);
    const steps = Math.min(Math.ceil(tof / dt), 40000);
    const every = Math.max(1, Math.round(steps / 90));
    const wall = lvl.ox === undefined ? null : { x0: lvl.ox, x1: lvl.ox + WALL_W, top: lvl.oy };

    const at = t => ({ x: vx * t, y: vy * t - 0.5 * G * t * t });
    const gap = t => { const p = at(t); return Math.hypot(p.x - lvl.d, p.y - lvl.h); };

    const path = [];
    let closest = { d: Infinity, x: 0, y: 0 }, tBest = 0, obstacle = null;

    for (let i = 0; i <= steps; i++) {
      const t = i * dt;
      const { x, y } = at(t);
      if (y < 0) break;
      if (i % every === 0) path.push({ x, y });
      const d = Math.hypot(x - lvl.d, y - lvl.h);
      if (d < closest.d) { closest = { d, x, y }; tBest = t; }
      if (wall && x >= wall.x0 && x <= wall.x1 && y <= wall.top) { obstacle = { x, y }; break; }
    }
    path.push(obstacle || { x: range, y: 0 });

    // Tighten the sampled minimum so an exact shot reports 0, not a step artefact.
    let lo = Math.max(0, tBest - dt), hi = Math.min(tof, tBest + dt);
    for (let i = 0; i < 60 && hi - lo > 1e-9; i++) {
      const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
      if (gap(m1) < gap(m2)) hi = m2; else lo = m1;
    }
    const tRef = (lo + hi) / 2, best = at(tRef), dRef = gap(tRef);
    if (dRef < closest.d) closest = { d: dRef, x: best.x, y: best.y };

    return { vx, vy, range, heightAtTarget, path, closest, obstacle };
  }

  /* ---- firing ---------------------------------------------------------- */
  function say(kind, text) { ui.status.className = 'show ' + kind; ui.status.textContent = text; }

  function launch() {
    clearTimeout(advanceTimer);
    const lvl = levels[state.level];
    const adv = isAdv(state.level);
    const names = adv ? ['ux', 'uy', 'inverseux', 'inverseuy']
                      : ['u', 'costheta', 'inverseu', 'inversecostheta'];

    let res;
    try { res = readVars(ui.code.value, names); }
    catch (err) { return say('bad', 'Your code did not run: ' + err.message); }

    const missing = names.filter(n => !Number.isFinite(Number(res[n])));
    if (missing.length) return say('bad', 'Give a number to ' + missing.join(', ') + '.');
    if (!adv && !(res.costheta > 0 && res.costheta < 1))
      return say('bad', 'costheta has to sit between 0 and 1.');

    const [a, b] = lvl.t(Number(res[names[2]]), Number(res[names[3]]));

    let vx, vy;
    if (adv) { vx = a; vy = b; }
    else {
      if (!(b > 0 && b < 1))
        return say('bad', `The launcher turned your cosine into ${fmt(b)}, outside 0 to 1. Compensate with inversecostheta.`);
      if (!(a > 0))
        return say('bad', `The launcher turned your speed into ${fmt(a)} m/s. It has to stay positive.`);
      vx = a * b;
      vy = a * Math.sqrt(1 - b * b);
    }
    if (!(vx > 0) || !(vy > 0))
      return say('bad', `That fires at ux ${fmt(vx)}, uy ${fmt(vy)} m/s. Both have to be positive.`);

    state.shot = simulate(vx, vy, lvl);
    animate = true;
    syncInfo();
    render();
    animate = false;

    const shot = state.shot;
    if (shot.obstacle) {
      say('bad', `Stopped by the wall at ${fmt(shot.obstacle.x)} m, ${fmt(shot.obstacle.y)} m up.`);
    } else if (shot.closest.d <= lvl.tol) {
      state.cleared.add(state.level);
      const next = (state.level + 1) % levels.length;
      say('ok', `Hit, ${fmt(shot.closest.d)} m from centre. Level ${next + 1} next.`);
      advanceTimer = setTimeout(() => goto(next, true), 1500);
    } else {
      say('bad', `Missed by ${fmt(shot.closest.d)} m.`);
    }
  }

  /* ---- view ------------------------------------------------------------ */
  function niceStep(span) {
    const raw = span / 9;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  }

  function syncInfo() {
    const lvl = levels[state.level], shot = state.shot, adv = isAdv(state.level);

    ui.count.textContent = `Level ${state.level + 1} of ${levels.length}`;
    [...ui.ticks.children].forEach((t, i) => {
      t.className = 'tick' + (levels[i].ox !== undefined ? ' wall' : '') +
        (i === state.level ? ' on' : state.cleared.has(i) ? ' done' : '');
      t.setAttribute('aria-current', i === state.level ? 'true' : 'false');
    });

    ui.tDist.innerHTML = metres(lvl.d);
    ui.tHeight.innerHTML = metres(lvl.h);
    ui.rRange.innerHTML = shot ? metres(shot.range) : '\u2014';
    ui.rHeight.innerHTML = shot ? metres(shot.heightAtTarget) : '\u2014';
    ui.rMiss.innerHTML = shot ? (shot.obstacle ? 'blocked' : metres(shot.closest.d)) : '\u2014';

    ui.code.placeholder = adv ? placeholder.adv : placeholder.basic;
    ui.briefTitle.textContent = `Level ${state.level + 1}`;
    ui.briefText.textContent = lvl.ox === undefined
      ? `Land inside ${lvl.tol} m of the target.`
      : `Clear the ${lvl.oy} m wall at ${lvl.ox} m, then land inside ${lvl.tol} m of the target.`;
    ui.varList.innerHTML = (adv ? varHelp.adv : varHelp.basic)
      .map(([n, d]) => `<li><span>${n}</span> <em>${d}</em></li>`).join('');
  }

  function render() {
    const lvl = levels[state.level], shot = state.shot;
    const W = ui.plot.clientWidth || 800, H = ui.plot.clientHeight || 360;

    let maxX = Math.max(lvl.d * 1.18, 200);
    let maxY = Math.max(lvl.h, lvl.oy || 0, 60) * 1.7;
    if (shot) {
      maxX = Math.max(maxX, Math.min(shot.range * 1.08, lvl.d * 3));
      maxY = Math.max(maxY, Math.min(shot.vy * shot.vy / (2 * G) * 1.12, maxY * 3));
    }
    const kx = W / maxX, ky = (H - 18) / maxY;
    const X = x => +(x * kx).toFixed(1), Y = y => +(H - y * ky).toFixed(1);

    const stepX = niceStep(maxX), stepY = niceStep(maxY);
    let fine = '', main = '', labels = '';
    for (let i = 0; i * (stepX / 5) <= maxX; i++) fine += `M${X(i * stepX / 5)} 0V${H}`;
    for (let i = 0; i * (stepY / 5) <= maxY; i++) fine += `M0 ${Y(i * stepY / 5)}H${W}`;
    for (let i = 0; i * stepX <= maxX; i++) {
      const v = i * stepX; main += `M${X(v)} 0V${H}`;
      if (i) labels += `<text class="axis" x="${X(v) + 4}" y="${H - 6}">${Math.round(v)}</text>`;
    }
    for (let i = 0; i * stepY <= maxY; i++) {
      const v = i * stepY; main += `M0 ${Y(v)}H${W}`;
      if (i) labels += `<text class="axis" x="5" y="${Y(v) - 5}">${Math.round(v)}</text>`;
    }

    const svg = [
      `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`,
      `<defs><pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">`,
      `<rect width="9" height="9" fill="var(--panel)"/><rect width="4.5" height="9" fill="var(--caution)" opacity=".85"/>`,
      `</pattern></defs>`,
      `<path class="grid-fine" d="${fine}"/><path class="grid-main" d="${main}"/>${labels}`,
      `<line class="ground" x1="0" y1="${H - 1}" x2="${W}" y2="${H - 1}"/>`
    ];

    if (lvl.ox !== undefined) {
      const w = Math.max(WALL_W * kx, 12);
      const x0 = (lvl.ox + WALL_W / 2) * kx - w / 2;
      const top = Y(lvl.oy);
      svg.push(
        `<rect class="wall-body" x="${x0.toFixed(1)}" y="${top}" width="${w.toFixed(1)}" height="${(H - top).toFixed(1)}" fill="url(#hz)"/>`,
        `<rect class="wall-cap" x="${(x0 - 2).toFixed(1)}" y="${(top - 4).toFixed(1)}" width="${(w + 4).toFixed(1)}" height="4"/>`,
        `<text class="caption" x="${(x0 + w + 6).toFixed(1)}" y="${(top + 12).toFixed(1)}">${lvl.oy} m</text>`
      );
    }

    if (shot && shot.path.length > 1) {
      const pts = shot.path.map(p => `${X(p.x)},${Y(p.y)}`).join(' ');
      svg.push(`<polyline class="traj${animate ? ' draw' : ''}" pathLength="1" points="${pts}"/>`);
      const m = shot.obstacle || shot.closest;
      const hit = !shot.obstacle && shot.closest.d <= lvl.tol;
      if (!hit) svg.push(`<circle class="mark${animate ? ' draw' : ''}" cx="${X(m.x)}" cy="${Y(m.y)}" r="5"/>`);
    }

    const tx = X(lvl.d), ty = Y(lvl.h);
    svg.push(
      `<line class="cross" x1="${tx - 16}" y1="${ty}" x2="${tx + 16}" y2="${ty}"/>`,
      `<line class="cross" x1="${tx}" y1="${ty - 16}" x2="${tx}" y2="${ty + 16}"/>`,
      `<circle class="ring" cx="${tx}" cy="${ty}" r="9"/><circle class="bull" cx="${tx}" cy="${ty}" r="3"/>`,
      `</svg>`
    );

    ui.plot.innerHTML = svg.join('');
  }

  /* ---- wiring ---------------------------------------------------------- */
  function goto(i, clearCode) {
    clearTimeout(advanceTimer);
    state.level = i;
    state.shot = null;
    if (clearCode) ui.code.value = '';
    ui.status.className = '';
    syncInfo();
    render();
  }

  ui.ticks.innerHTML = levels.map((l, i) =>
    `<button class="tick" data-i="${i}" title="Level ${i + 1}${l.ox !== undefined ? ' — wall' : ''}"` +
    ` aria-label="Level ${i + 1}${l.ox !== undefined ? ', has a wall' : ''}"></button>`).join('');

  ui.ticks.addEventListener('click', e => {
    const b = e.target.closest('.tick');
    if (b) goto(Number(b.dataset.i), false);
  });
  ui.fire.addEventListener('click', launch);
  ui.code.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); launch(); }
  });

  let frame = 0;
  window.addEventListener('resize', () => {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(render);
  });

  goto(0, true);
})();
</script>
</body>
</html>
